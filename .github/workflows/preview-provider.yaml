name: Preview provider

# Tests, builds and publishes the preview provider described in PREVIEW.md.
#
# Publishing is manual only: it writes to the gh-pages branch, and Terraform
# caches providers by version, so pushing a version twice does not reliably
# reach consumers. Pushes to main only test and build, so a broken
# cross-compile is caught without touching the mirror.
#
# This workflow lives on main and must never reach
# fix/preserve-unreadable-repo-fields — that branch is for upstream only.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 6.13.1-th7.2. Must carry a prerelease suffix."
        required: true
        type: string
      allow_overwrite:
        description: "Replace the version if it already exists in the mirror"
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: preview-provider
  cancel-in-progress: false

env:
  # Placeholder for push-triggered validation builds, which never publish.
  VERSION: ${{ inputs.version || '0.0.0-validation' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set-up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Unit tests only. Acceptance tests need real credentials and a test
      # organization, and CI (ci.yaml) already covers lint and docs on main.
      - run: make test

  build:
    name: Build ${{ matrix.goos }}_${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set-up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Reject a version that could pass for an upstream release
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          case "${VERSION}" in
            *-*) ;;
            *)
              echo "::error::Version '${VERSION}' has no prerelease suffix. Without one it can" \
                   "collide with an upstream release and be selected by a plain constraint."
              exit 1
              ;;
          esac

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" \
            -o "terraform-provider-github_v${VERSION}"

      - name: Package
        run: |
          set -euo pipefail
          zip "terraform-provider-github_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" \
            "terraform-provider-github_v${VERSION}"

      - name: Upload
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-${{ matrix.goos }}_${{ matrix.goarch }}
          path: terraform-provider-github_${{ env.VERSION }}_*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set-up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: archives
          merge-multiple: true

      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          index=gh-pages/mirror/registry.terraform.io/th7/github/index.json
          if jq -e --arg v "${VERSION}" '.versions | has($v)' "$index" >/dev/null; then
            if [ "${{ inputs.allow_overwrite }}" != "true" ]; then
              echo "::error::Version ${VERSION} is already published. Terraform caches by" \
                   "version, so consumers may never see a replacement. Bump the version, or" \
                   "re-run with allow_overwrite."
              exit 1
            fi
            echo "::warning::Overwriting existing version ${VERSION} on request."
          fi

      # Hashes are computed per platform in separate directories: a combined
      # run writes every hash into one lock file without recording which
      # archive each belongs to.
      - name: Compute h1 hashes
        run: |
          set -euo pipefail
          fsmirror="$GITHUB_WORKSPACE/fsmirror"
          mkdir -p "$fsmirror/registry.terraform.io/th7/github"
          cp archives/*.zip "$fsmirror/registry.terraform.io/th7/github/"

          echo "{}" > hashes.json
          for platform in linux_amd64 linux_arm64; do
            work="$(mktemp -d)"
            cat > "$work/main.tf" <<EOF
          terraform {
            required_providers {
              github = { source = "th7/github", version = "${VERSION}" }
            }
          }
          EOF
            (cd "$work" && terraform providers lock \
              -fs-mirror="$fsmirror" -platform="$platform" >/dev/null)
            hash="$(grep -oE 'h1:[A-Za-z0-9+/=]+' "$work/.terraform.lock.hcl")"
            [ -n "$hash" ] || { echo "::error::no hash computed for $platform"; exit 1; }
            jq --arg p "$platform" --arg h "$hash" --arg v "${VERSION}" \
              '.[$p] = {hashes: [$h], url: ("terraform-provider-github_" + $v + "_" + $p + ".zip")}' \
              hashes.json > hashes.tmp && mv hashes.tmp hashes.json
            echo "$platform -> $hash"
          done

      - name: Assemble the mirror
        run: |
          set -euo pipefail
          dir=gh-pages/mirror/registry.terraform.io/th7/github
          cp archives/*.zip "$dir/"
          jq --arg v "${VERSION}" '.versions[$v] = {}' "$dir/index.json" > index.tmp
          mv index.tmp "$dir/index.json"
          jq '{archives: .}' hashes.json > "$dir/${VERSION}.json"
          cat "$dir/index.json" "$dir/${VERSION}.json"

      - name: Commit and push
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "Publish ${VERSION} to the preview mirror

          Built from ${GITHUB_SHA} by the preview-provider workflow."
          git push origin gh-pages

      # Pages rebuilds asynchronously, so a plain init straight after the push
      # can still be served the previous index.
      - name: Verify the published mirror installs
        run: |
          set -euo pipefail
          base=https://th7.github.io/terraform-provider-github/mirror/
          url="${base}registry.terraform.io/th7/github/index.json"
          for attempt in $(seq 1 20); do
            if curl -fsSL "$url" | jq -e --arg v "${VERSION}" '.versions | has($v)' >/dev/null; then
              echo "mirror serving ${VERSION} after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Pages did not serve ${VERSION} within the timeout."
              exit 1
            fi
            sleep 15
          done

          work="$(mktemp -d)"
          cat > "$work/main.tf" <<EOF
          terraform {
            required_providers {
              github = { source = "th7/github", version = "${VERSION}" }
            }
          }
          EOF
          cd "$work"
          terraform providers lock -net-mirror="$base" \
            -platform=linux_amd64 -platform=linux_arm64
          cat .terraform.lock.hcl
